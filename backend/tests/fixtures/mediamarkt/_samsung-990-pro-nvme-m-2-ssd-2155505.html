__ref": "GraphqlProduct:Media:de-CH:2155504"}}, {"__typename": "GraphqlProductVariant", "cofrProductAggregate({})": {"__typename": "CofrProductAggregate", "productId": "2155505", "cofrOnlineStatusFeature": {"__ref": "CofrOnlineStatusFeature:Media:de:2155505"}, "cofrPriceFeature": {"__ref": "CofrPriceFeature:{\"id\":\"Media:de:2155505\",\"price\":{\"installment\":{\"__typename\":null}}}"}, "cofrRefurbishedGoodsFeature": {"__ref": "CofrRefurbishedGoodsFeature:Media:de:2155505"}}, "productId": "2155505", "displayName": "SAMSUNG 990 PRO NVMe M.2 SSD - Festplatte (SSD, 1 TB, Schwarz)", "imageId": "ASSET_MMS_99809019", "imageUrl": "https://assets.mmsrg.com/isr/166325/c1/-/ASSET_MMS_99809019", "variantValue": "1 TB", "product": {"__ref": "GraphqlProduct:Media:de-CH:2155505"}}, {"__typename": "GraphqlProductVariant", "cofrProductAggregate({})": {"__typename": "CofrProductAggregate", "productId": "2207540", "cofrOnlineStatusFeature": {"__ref": "CofrOnlineStatusFeature:Media:de:2207540"}, "cofrPriceFeature": {"__ref": "CofrPriceFeature:{\"id\":\"Media:de:2207540\",\"price\":{\"installment\":{\"__typename\":null}}}"}, "cofrRefurbishedGoodsFeature": {"__ref": "CofrRefurbishedGoodsFeature:Media:de:2207540"}}, "productId": "2207540", "displayName": "SAMSUNG 990 PRO NVMe M.2 SSD - Festplatte (SSD, 4 TB, Schwarz)", "imageId": "ASSET_MMS_133233345", "imageUrl": "https://assets.mmsrg.com/isr/166325/c1/-/ASSET_MMS_133233345", "variantValue": "4 TB", "product": {"__ref": "GraphqlProduct:Media:de-CH:2207540"}}]}], "additionalInformation": null, "retailRestrictions": [], "tax": 8.1, "productGroupId": 3450, "description": "<ul><li>Sequentielle Lese-/Schreibgeschwindigkeit von bis zu 7.450 / 6.900 MB/s</li>\n<li>PCIe-Schnittstelle 4. Generation</li></ul>\n\n<h3>Explosives Tempo für intensives Gaming</h3>\n<p>Entdecke die starke Leistung mit PCIe® 4.0 und erlebe rasante Geschwindigkeit, um dich der Konkurrenz zu stellen. Die intelligente Wärmeregulierung des Samsung Controllers bietet hohe Energieeffizienz bei gleichbleibend hoher Geschwindigkeit und Performance. So steht dem Gaming-Spass nichts mehr im Weg.</p>\n<p></p>\n<p>* Der bestmögliche theoretische Wert für sequenzielle Lesegeschwindigkeit von PCIe® 4.0 liegt bei 8.000 MB/s – die 990 PRO erreicht 7.450 MB/s.</p>\n<p></p>\n<p><h3>PCIe® mit rasanter Geschwindigkeit</h3></p>\n<p>Hol dir rasante Geschwindigkeit für dein Gaming-Erlebnis sowie für Video-und 3D-Bearbeitung, Datenanalyse und mehr. Denn dank PCIe® wird die Performance angepasst: Mit 40 % und 55 % schnellerer zufälliger Lese- und Schreibgeschwindigkeit im Vergleich zur 980 PRO, bis zu 1.400 K / 1.550 K IOPS sowie mit sequentiellen Lese-/Schreibgeschwindigkeiten von bis zu 7.450 / 6.900 MB/s.</p>\n<p></p>\n<p>* Die sequenzielle und zufällige Schreibleistung wurde mit aktivierter intelligenter TurboWrite-Technologie gemessen. Intelligentes TurboWrite arbeitet nur innerhalb einer bestimmten Datenübertragungsgrösse. Die Leistung kann je nach SSD-Firmware, Systemhardware und -konfiguration sowie anderen Faktoren variieren. Für detaillierte Informationen wende dich bitte an dein lokales Service-Center.</p>\n<p>** Testsystemkonfiguration: AMD Ryzen 7 5800X 8-Kern-Prozessor CPU@3,80 GHz, DDR4 3600 MHz 16 GB x 2 (PC4-25600 Overclock), Betriebssystem – Windows 10 Pro 64 Bit, Chipsatz – ASRock-X570 Taich.</p>\n<p>*** Um die Leistung des 990 PRO zu maximieren, überprüfe bitte auf der Intel- oder AMD-Website, ob ihr System PCIe® 4.0 unterstützt.</p>\n<p></p>\n<p><h3>Bahnbrechende Energieffizienz</h3></p>\n<p>Höhere Leistung verbraucht oftmals mehr Strom. Nicht mit der 990 PRO. Erlebe einen geringen Strombedarf durch eine um über 50 % pro Watt verbesserte Leistung gegenüber dem Vorgängermodell.</p>\n<p></p>\n<p>* 980 PRO sequenzielle Lesegeschwindigkeit – 1.129/877 MB/Watt, 990 PRO sequenzielle Lesegeschwindigkeit – 1.380/1.319 MB/Watt basierend auf internen Testergebnissen des Modells mit 1 TB Kapazität.</p>\n<p></p>\n<p><h3>Smarte Temperaturregulierung</h3></p>\n<p>Der nickelbeschichtete Controller und der hochmoderne thermische Steueralgorithmus regulieren die Wärme und ermöglichen so uneingeschränkte Performance. Das Heatspreader-Label kontrolliert die Wärme des NAND-Chips, während die Dynamic-Thermal Guard-Technologie die Temperaturen reguliert.</p>\n<p></p>\n<p><h3>Der Performance-Macher</h3></p>\n<p>Dein Spiel-Spass wird in weite Sphären katapultiert. Denn eine Leistungsverbesserung um mehr als 55 % gegenüber dem Vorgängermodell ermöglicht schnellere Ladevorgänge für ein authentischeres Gaming-Erlebnis von Playstation 5- und PC-Spielen mit Direct Storage Funktion.</p>\n<p></p>\n<p>* Wird von der Direct Storage Funktion von Microsoft unterstützt.</p>\n<p>** Ergebnisse basieren auf einem Vergleich mit der Samsung 980 PRO.</p>\n<p></p>\n<p><h3>Samsung Magician software</h3></p>\n<p>Fortschrittliche Laufwerksverwaltung einfach gemacht - mithilfe der Samsung Magician-Software. Die benutzerfreundliche Software-Lösung hilft dir dabei, immer ein Auge auf deine SSD zu haben. Damit kannst du dein Laufwerk mit Updates immer auf dem neusten Stand halten, Statusparameter und Geschwindigkeit überwachen und sogar die Leistungsfähigkeit optimieren.</p>\n<p></p>\n<p><h3>Weltweit die Nr.1 der Speichermedien</h3></p>\n<p>Erlebe die überragende Performance und Langlebigkeit, die dir Speichermedien von Samsung seit 2003 bieten. Die Firmware und alle Komponenten, unter anderem die weltbekannten Samsung DRAM und NAND-Technologien, werden in internen Betriebsstätten hergestellt und ermöglichen auf diese Weise eine nahtlose und zuverlässige Integration in dein Computer-System.</p>\n<p></p>\n<p>* Quelle : Daten von 2003 - 2019 IHS Markit: Umsatz und Marktanteil von NAND-Herstellern.</p>", "descriptionMarketing": null, "accessoriesRelated": [], "hasDataEraseCode": false, "predecessorProductIds": [], "predecessor": null, "successorProductIds": [], "successor": null, "assetSafetyInformationDocuments": null, "assetCeConformityDeclara
