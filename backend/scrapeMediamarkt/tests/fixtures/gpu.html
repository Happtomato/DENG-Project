GRAPHICS_CARD", "onlineReleasedAt": null, "featureGroupsWithProductId": {"__ref": "GraphqlProductFeatureGroups:2277751"}, "assetFeatureImages": [], "featureName": "GRAPHICS CARDS", "breadcrumbs": [{"__typename": "GraphqlBreadcrumb", "categoryId": "CAT_CH_MM_750531", "name": "Computer & Software"}, {"__typename": "GraphqlBreadcrumb", "categoryId": "CAT_CH_MM_751013", "name": "PC-Komponenten"}, {"__typename": "GraphqlBreadcrumb", "categoryId": "CAT_CH_MM_751073", "name": "Grafikkarten"}], "ean": "4711387837832", "manufacturer": "ASUS", "manufacturerId": "2383", "url": "/de/product/_asus-prime-geforce-rtx-5070-12gb-gddr7-nvidia-grafikkarte-2277751.html", "vat": {"__typename": "GraphqlVat", "rate": 0.081}, "variants": [], "additionalInformation": null, "retailRestrictions": [], "tax": 8.1, "productGroupId": 3853, "description": "<h3>Die SFF-Ready ASUS Prime GeForce RTX™ 5070 12GB GDDR7 verfügt über drei Axial-Tech-Lüfter für optimale Kühlung.</h3>\n<ul><li>Angetrieben von der NVIDIA Blackwell Architektur und DLSS 4</li>\n<li>SFF-Ready Enthusiast GeForce Karte</li>\n<li>Axial-Tech-Lüfter verfügen über eine kleinere Lüfternabe, die längere Flügel ermöglicht, und einen Sperrring, der den Luftdruck nach unten erhöht</li>\n<li>Das Phase-Change-GPU-Wärmeleitpad sorgt für eine optimale Wärmeübertragung und senkt die GPU-Temperaturen für mehr Leistung und Zuverlässigkeit</li>\n<li>Das 2.5-Slot-Design ermöglicht eine größere Kompatibilität mit verschiedenen Builds bei gleichbleibender Kühlleistung</li>\n<li>Lüfter mit Doppelkugellager halten bis zu doppelt so lange wie Standard-Gleitlager</li>\n<li>Mit der 0dB-Technologie kannst du leichte Spiele in relativer Stille genießen</li>\n<li>Mit dem Dual-BIOS-Schalter kannst du zwischen den BIOS-Profilen \"Leise\" und \"Leistung\" umschalten</li>\n<li>Auto-Extreme Fertigungsverfahren für Präzision und Zuverlässigkeit</li>\n<li>Die GPU Tweak III Software bietet intuitive Leistungsoptimierung, fortschrittliche Wärmekontrolle und Systemüberwachung</li></ul>\n\n<h3>Primed for Power</h3>\n<p>Erlebe die ultimative Leistung der Prime GeForce RTX 5070, einer SFF-fähigen Enthusiast-GeForce-Karte mit einem 2,5-Slot-Design für umfassende Kompatibilität, die durch ein Dreifach-Lüfter-Setup für eine optimale Luftzirkulation und eine optimale Kühlung ergänzt wird.</p>\n<p></p>\n<p><h3>Baue kompakt. Spiele groß.</h3></p>\n<p>Mit dieser SFF-Ready Enthusiast GeForce-Karte kannst du hohe Leistung in ein kleineres Gehäuse packen. Suche nach Gehäusen, die mit SFF-Ready Enthusiast GeForce-Karten kompatibel sind, um die richtige Größe zu erhalten und deinen PC-Build zu optimieren.</p>\n<p></p>\n<p><h3>2.5-Slot-Design</h3></p>\n<p>Die Prime RTX 5070 verfügt über ein 2,5-Slot-Design mit einem sorgfältig angeordneten Layout für die Abdeckung, den Kühlkörper und die Heatpipes, damit die drei Axial-Tech-Lüfter die Belüftung der Gehäuseseitenwände nutzen und eine optimale thermische Leistung liefern können.</p>\n<p></p>\n<p><h3>Axial-Tech Upgrades</h3></p>\n<p>Die drei bewährten Axial-Tech-Lüfter verfügen über eine kleinere Nabe, die längere Flügel ermöglicht, und einen Sperrring, der den Luftdruck nach unten erhöht und so für niedrigere Temperaturen, weniger Lärm und höhere Leistung sorgt</p>\n<p></p>\n<p><h3>0dB-Technologie</h3></p>\n<p>Alle drei Lüfter kommen zum Stillstand, wenn die GPU-Temperaturen unter 50 Celsius liegen. So kannst du weniger anspruchsvolle Spiele spielen oder leichte Aufgaben in relativer Ruhe erledigen. Die Lüfter schalten sich wieder ein, wenn die Temperatur über 55 °C liegt, und stellen eine Geschwindigkeitskurve ein, die ein Gleichgewicht zwischen Leistung und Akustik für Arbeit und Spiel herstellt.</p>\n<p></p>\n<p><h3>Lüfter mit Doppelkugellagern</h3></p>\n<p>Verschiedene Lagertypen haben einzigartige Vor- und Nachteile. Doppelkugellager zeichnen sich durch ihre Langlebigkeit aus und können bis zu doppelt so lange halten wie Gleitlager.</p>\n<p></p>\n<p><h3>Belüftete Backplate</h3></p>\n<p>Die großen Belüftungsöffnungen in der Backplate verbessern die Wärmeableitung erheblich und sorgen dafür, dass die GPU bei intensiven Aufgaben kühler bleibt. Dieser zusätzliche Luftstrom sorgt für optimale Temperaturen und erhöht die Leistung, Langlebigkeit und Stabilität, indem er Überhitzung und thermisches Throttling verhindert.</p>\n<p></p>\n<p><h3>MaxContact Design</h3></p>\n<p>MaxContact ist ein spezielles ASUS-Fertigungsverfahren, das die Oberfläche des Wärmespreizers, der auf der GPU sitzt, im Vergleich zu herkömmlichen Designs um 5% vergrößert. In Verbindung mit einer umfangreichen Kühlkörperanordnung und leistungsstarken Axial-Tech-Lüftern verbessert dies die Temperaturen um bis zu 2°C.</p>\n<p></p>\n<p><h3>Phase-Change GPU Thermal Pad</h3></p>\n<p>Ein hochwertiges Phase-Change-GPU-Wärmeleitpad, das durch Schmelzen die Lücken zwischen der GPU und dem Kühlkörper effektiv ausfüllt, bietet eine hervorragende Wärmeleitfähigkeit und eine verbesserte Wärmeableitung und gewährleistet so eine optimale Leistung und Langlebigkeit von Grafikkarten unter hoher Last.</p>\n<p></p>\n<p><h3>ASUS GPU Guard & Bracket</h3></p>\n<p>ASUS GPU Guard sichert alle vier Ecken mit Klebstoff, um das Risiko von Rissen zu verringern, während eine GPU-Halterung für gleichmäßigen Anpressdruck und zusätzliche Stabilität sorgt.</p>\n<p></p>\n<p><h3>Schützende Backplate</h3></p>\n<p>Die Platine wird durch eine Backplate verstärkt, die für zusätzliche strukturelle Steifigkeit sorgt und dazu beiträgt, dass sich die Leiterplatte nicht verbiegt und die Komponenten und Leiterbahnen vor Beschädigungen schützt.</p>\n<p></p>\n<p><h3>Halterung aus Edelstahl</h3></p>\n<p>Die Halterung besteht aus rostfreiem Stahl der Güteklasse 304, der für seine Stärke und hohe Korrosionsbeständigkeit ausgewählt wurde.</p>\n<p></p>\n<p><h3>Dual BIOS</h3></p>\n<p>Legst du Wert auf niedrige Kerntemperaturen oder niedrige Geräuschpegel? Der Performance-Modus lässt die Lüfter aufdrehen, damit die Karte die ganze Zeit über kühl läuft, und der Quiet-Modus behält das gleiche Leistungsziel und die Top-End-Einstellungen bei, bietet aber eine weniger aggressive Lüfterkurve für einen leiseren Betrieb bei moderaten Temperaturen.</p>\n<p></p>\n<p><h3>Auto-Extrem-Technologie</h3></p>\n<p>Die ASUS Auto-Extreme Technologie reduziert die thermische Belastung der Komponenten und vermeidet den Einsatz von scharfen Reinigungschemikalien. Das Ergebnis sind geringere Umweltbelastungen, ein niedrigerer Energieverbrauch und ein insgesamt zuverlässigeres Produkt.</p>\n<p></p>\n<p><h3>Das beste Netzteil für die GeForce RTX 50 Serie</h3></p>\n<p>Nutze den Watt-Rechner, um abzuschätzen, wie viel Strom du für dein System benötigst, und wähle dann ein kompatibles ROG-, TUF Gaming- oder Prime-Netzteil für die ultimative Leistung.</p>\n<p></p>\n<p><h3>RTX. Es geht los.</h3></p>\n<p><h3>Das Nonplusultra in Raytracing und KI</h3></p>\n<p>RTX ist die fortschrittlichste Plattform für vollständiges Raytracing und neuronale Rendering-Technologien, die die Art und Weise, wie wir spielen und kreativ sind, revolutionieren. Über 700 Spiele und Anwendungen nutzen RTX, um realistische Grafiken und unglaublich schnelle Leistung mit innovativen KI-Funktionen wie DLSS Multi Frame Generation zu liefern.</p>\n<p></p>\n<p><h3>Kreative</h3></p>\n<p><h3>Dein kreativer KI-Vorteil</h3></p>\n<p>NVIDIA Studio ist dein kreativer Vorteil. NVIDIA Studio ist dein kreativer Vorteil. Die GeForce RTX 50-Serie bietet transformative Leistung bei Videobearbeitung, 3D-Rendering und Grafikdesign. Erlebe RTX-Beschleunigungen in kreativen Top-Apps, erstklassige NVIDIA Studio-Treiber, die für maximale Stabilität entwickelt wurden und stetig weiterentwickelt werden sowie eine Suite exklusiver Tools, die die Leistung von RTX für KI-gestützte kreative Workflows nutzen.</p>", "descriptionMarketing": null, "accessoriesRelated": [], "hasDataEraseCode": false, "predecessorProductIds": [], "predecessor": null, "successorProductIds": [], "successor": null, "a
