services:

  scrape_digitec:
    build: ./backend/scrapeDigitec
    ports:
      - "8010:5000"
    networks:
      - deng-project-network

  ingest_digitec:
    build: ./backend/ingestDigitec
    ports:
      - "8011:5000"
    networks:
      - deng-project-network

  scrape_mediamarkt:
    build: ./backend/scrapeMediamarkt
    ports:
      - "8020:5000"
    networks:
      - deng-project-network

  ingest_mediamarkt:
    build: ./backend/ingestMediamarkt
    ports:
      - "8021:5000"
    networks:
      - deng-project-network

  scrape_brack:
    build: ./backend/scrapeMediamarkt
    ports:
      - "8030:5000"
    networks:
      - deng-project-network

  ingest_brack:
    build: ./backend/ingestMediamarkt
    ports:
      - "8031:5000"
    networks:
      - deng-project-network

  scrape_interdiscount:
    build: ./backend/scrapeMediamarkt
    ports:
      - "8040:5000"
    networks:
      - deng-project-network

  ingest_interdiscount:
    build: ./backend/ingestMediamarkt
    ports:
      - "8041:5000"
    networks:
      - deng-project-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: http://localhost:3000
    networks:
      - deng-project-network

  prefect_server:
    image: prefecthq/prefect:3-python3.12
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_UI_API_URL: http://localhost:4200/api
    volumes:
      - prefect_data:/root/.prefect
    networks:
      - deng-project-network

  prefect_runner:
    build: ./backend/orchestrator
    depends_on:
      - prefect_server
    environment:
      PREFECT_API_URL: http://prefect_server:4200/api
    networks:
      - deng-project-network
    restart: unless-stopped

  postgres:
    image: postgres:18.6-bookworm

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./data/initialization.sql:/docker-entrypoint-initdb.d/01-initialization.sql:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    ports:
      - "5432:5432"

    networks:
      - deng-project-network

  seed_database:
    build: ./backend/seedDatabase

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./data/seed:/app/seed:ro

    networks:
      - deng-project-network

    restart: "no"

volumes:
  postgres_data:
  prefect_data:

networks:
  deng-project-network:
    driver: bridge