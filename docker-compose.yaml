name: deng-project

x-pipeline: &pipeline
  image: deng-midterm:0.3
  build:
    context: .
    dockerfile: backend/Dockerfile
  networks: [deng-project-network]

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports: ['127.0.0.1:5432:5432']
    networks: [deng-project-network]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  db_init:
    <<: *pipeline
    command: ['python', '-m', 'backend.flow', 'init']
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  prefect_server:
    <<: *pipeline
    command: ['prefect', 'server', 'start', '--host', '0.0.0.0']
    environment:
      PREFECT_SERVER_UI_API_URL: http://localhost:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: 'false'
    volumes: [prefect_data:/root/.prefect]
    ports: ['127.0.0.1:4200:4200']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 18

  pipeline:
    <<: *pipeline
    command: ['python', '-m', 'backend.flow', 'serve']
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PREFECT_API_URL: http://prefect_server:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: 'false'
      PIPELINE_CRON: ${PIPELINE_CRON:-0 3 * * *}
      PIPELINE_MAX_PRODUCTS: ${PIPELINE_MAX_PRODUCTS:-3}
      PIPELINE_MAX_REQUESTS: ${PIPELINE_MAX_REQUESTS:-20}
      PIPELINE_DELAY_SECONDS: ${PIPELINE_DELAY_SECONDS:-3}
    volumes: ['./data:/workspace/data']
    depends_on:
      db_init:
        condition: service_completed_successfully
      prefect_server:
        condition: service_healthy
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: deng-pc-price-lab:0.1
    environment:
      ORIGIN: http://localhost:3000
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PREFECT_API_URL: http://prefect_server:4200/api
      PREFECT_UI_URL: http://localhost:4200
      CATALOG_PATH: /workspace/data/catalog/mediamarkt.json
    volumes:
      - ./data/catalog:/workspace/data/catalog:ro
    ports: ['127.0.0.1:3000:3000']
    networks: [deng-project-network]
    depends_on:
      db_init:
        condition: service_completed_successfully
      prefect_server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/verify').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  prefect_data:

networks:
  deng-project-network:
    driver: bridge
